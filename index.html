const MediaCtx = createContext({ images: {}, setImage: () => {} });

function MediaProvider({ children }) {
  const [images, setImgs] = useState({ ...IMAGES });
  const setImage = (id, src) => setImgs(p => ({ ...p, [id]: src }));
  return html`<${MediaCtx.Provider} value=${{ images, setImage }}>${children}<//>`;
}

const Svg = ({ d, size = 20, children, className = '' }) => html`
  <svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="square" aria-hidden="true" className=${className}>${d ? html`<path d=${d} />` : children}</svg>`;
const IconCheck = (p) => html`<${Svg} ...${p} d="M4 12.5l5 5L20 6.5" />`;
const IconExt = (p) => html`<${Svg} size=${16} ...${p} d="M7 17L17 7M9 7h8v8" />`;
const IconArrow = (p) => html`<${Svg} ...${p} d="M4 12h16M14 6l6 6-6 6" />`;
const IconPlus = (p) => html`<${Svg} ...${p} d="M12 5v14M5 12h14" />`;
const IconMenu = () => html`<${Svg} size=${26} d="M3 7h18M3 12h18M3 17h18" />`;
const IconClose = () => html`<${Svg} size=${26} d="M5 5l14 14M19 5L5 19" />`;
const IconCam = ({ size = 28 }) => html`<${Svg} size=${size}><path d="M3 8h4l2-3h6l2 3h4v11H3z" /><circle cx="12" cy="13" r="3.5" /><//>`;

function Btn({ to, href, onClick, variant = 'primary', children, className = '', type = 'button', ...rest }) {
  const base = 'inline-flex items-center justify-center gap-2 min-h-[52px] px-7 font-display font-bold uppercase tracking-[.08em] text-[1.15rem] rounded-[3px] transition-colors duration-200 text-center';
  const v = {
    primary: 'bg-ember text-ink hover:bg-[#ff8a33]',
    ghost: 'border border-bone/70 text-bone hover:bg-bone hover:text-ink',
    dark: 'bg-ink text-bone hover:bg-char',
    darkghost: 'border-2 border-ink text-ink hover:bg-ink hover:text-bone'
  }[variant];
  const cls = base + ' ' + v + ' ' + className;
  if (href) return html`<a href=${href} target="_blank" rel="noopener noreferrer" className=${cls} ...${rest}>${children}<${IconExt} /><span className="sr-only">(opens in a new tab)</span></a>`;
  if (to) return html`<a href=${'#' + to} className=${cls} ...${rest}>${children}</a>`;
  return html`<button type=${type} onClick=${onClick} className=${cls} ...${rest}>${children}</button>`;
}

const Wrap = ({ children, className = '' }) => html`<div className=${'mx-auto w-full max-w-[1360px] px-5 sm:px-8 lg:px-12 ' + className}>${children}</div>`;

const H2 = ({ children, className = '' }) => html`<h2 className=${'font-display font-extrabold uppercase leading-[.92] tracking-tight text-5xl sm:text-6xl lg:text-7xl ' + className}>${children}</h2>`;

/* Photo slot: shows the real image when IMAGES[id] is set, otherwise an honest placeholder
   with an "Add photo" control (session-only preview for local files). */
function Photo({ id, aspect = '4 / 3', variant = 'full', className = '', fit = 'cover' }) {
  const { images, setImage } = useContext(MediaCtx);
  const [label, hint] = SLOT_META[id] || [id, ''];
  const src = images[id];
  const inputRef = useRef(null);
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f && f.type.indexOf('image/') === 0) setImage(id, URL.createObjectURL(f));
  };
  const boxStyle = variant === 'bg' ? {} : { aspectRatio: aspect };
  const outer = variant === 'bg' ? 'absolute inset-0 ' : 'relative w-full overflow-hidden ';

  if (src) {
    return html`<div className=${outer + className} style=${boxStyle}>
      <img src=${src} alt=${id.indexOf('event') === 0 ? label : 'RA-1: ' + label} loading="lazy" className=${'absolute inset-0 h-full w-full ' + (fit === 'contain' ? 'object-contain' : 'object-cover') + (id.indexOf('event') === 0 ? ' object-top' : '')} />
    </div>`;
  }
  if (variant === 'thumb') {
    return html`<div className=${outer + 'ph flex items-center justify-center text-mute ' + className} style=${boxStyle} role="img" aria-label=${'Placeholder: ' + label}><${IconCam} size=${20} /></div>`;
  }
  const upload = html`
    <input ref=${inputRef} type="file" accept="image/*" className="sr-only" tabIndex=${-1} aria-hidden="true" onChange=${onFile} />
    <button type="button" onClick=${() => inputRef.current && inputRef.current.click()}
      className="min-h-[44px] border border-bone/60 px-4 font-display text-base font-bold uppercase tracking-[.08em] text-bone transition-colors hover:bg-bone hover:text-ink">
      Add photo
    </button>`;
  if (variant === 'bg') {
    return html`<div className=${outer + 'ph ' + className}>
      <div className="absolute right-4 top-4 z-[5] flex max-w-[calc(100%-2rem)] flex-wrap items-center gap-3 bg-ink/80 p-3 text-sm text-mute sm:right-8 sm:top-8">
        <span>Photo slot: ${label}</span>${upload}
      </div>
    </div>`;
  }
  return html`<div className=${outer + 'ph ' + className} style=${boxStyle}>
    <span className="corner left-3 top-3 border-l-2 border-t-2"></span><span className="corner right-3 top-3 border-r-2 border-t-2"></span>
    <span className="corner bottom-3 left-3 border-b-2 border-l-2"></span><span className="corner bottom-3 right-3 border-b-2 border-r-2"></span>
    <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 p-6 text-center">
      <span className="text-ember"><${IconCam} /></span>
      <p className="font-display text-2xl font-bold uppercase leading-none tracking-wide">${label}</p>
      <p className="max-w-[28ch] text-sm leading-snug text-mute">${hint}</p>
      <p className="text-xs text-mute">Placeholder. Not a product photograph.</p>
      ${upload}
    </div>
  </div>`;
}

/* ---------- Gallery ---------- */
function Gallery({ className = '' }) {
  const [i, setI] = useState(0);
  const total = GALLERY.length;
  const go = (n) => setI(((n % total) + total) % total);
  const onKey = (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(i - 1); }
    if (e.key === 'Home') { e.preventDefault(); go(0); }
    if (e.key === 'End') { e.preventDefault(); go(total - 1); }
  };
  const id = GALLERY[i];
  const [label] = SLOT_META[id];
  return html`
  <div className=${className} role="group" aria-roledescription="carousel" aria-label="RA-1 photo gallery">
    <div tabIndex=${0} onKeyDown=${onKey} aria-label="Gallery viewer. Use left and right arrow keys to change photo." className="relative">
      <div key=${id} className="fadein"><${Photo} id=${id} aspect="4 / 3" /></div>
    </div>
    <div className="mt-3 flex items-center justify-between gap-4">
      <p className="font-display text-xl font-semibold uppercase tracking-wide" aria-live="polite">${label}<span className="ml-3 text-base font-medium text-mute">${i + 1} of ${total}</span></p>
      <div className="flex gap-2">
        <button type="button" onClick=${() => go(i - 1)} aria-label="Previous photo" className="flex h-11 w-11 items-center justify-center border border-line transition-colors hover:border-ember hover:text-ember"><${IconArrow} className="rotate-180" /></button>
        <button type="button" onClick=${() => go(i + 1)} aria-label="Next photo" className="flex h-11 w-11 items-center justify-center border border-line transition-colors hover:border-ember hover:text-ember"><${IconArrow} /></button>
      </div>
    </div>
    <div className="no-scrollbar mt-3 flex gap-2 overflow-x-auto pb-2" role="list">
      ${GALLERY.map((g, n) => html`
        <button key=${g} type="button" role="listitem" onClick=${() => setI(n)} aria-label=${'Show ' + SLOT_META[g][0]} aria-current=${n === i ? 'true' : undefined}
          className=${'w-24 shrink-0 border-2 transition-colors sm:w-28 ' + (n === i ? 'border-ember' : 'border-transparent hover:border-line')}>
          <${Photo} id=${g} variant="thumb" aspect="4 / 3" />
        </button>`)}
    </div>
  </div>`;
}

/* ---------- Forms (honest: only "sent" if a real destination is configured) ---------- */
function Field({ f, value, error, onChange }) {
  const id = 'f-' + f.k;
  const common = 'w-full border bg-ink px-4 py-3 text-base text-bone placeholder:text-mute focus:border-ember ' + (error ? 'border-[#ff7a7a]' : 'border-line');
  const aria = { 'aria-invalid': error ? 'true' : undefined, 'aria-describedby': error ? id + '-err' : undefined, 'aria-required': f.req ? 'true' : undefined };
  let control;
  if (f.type === 'textarea') control = html`<textarea id=${id} rows="5" value=${value || ''} onChange=${e => onChange(f.k, e.target.value)} className=${common} placeholder=${f.ph || ''} ...${aria}></textarea>`;
  else if (f.type === 'select') control = html`<select id=${id} value=${value || ''} onChange=${e => onChange(f.k, e.target.value)} className=${common} ...${aria}>${f.opts.map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
  else if (f.type === 'checks') {
    return html`<fieldset className="sm:col-span-2">
      <legend className="mb-2 text-sm font-medium">${f.label}</legend>
      <div className="grid gap-2 sm:grid-cols-2">
        ${f.opts.map(o => {
          const on = (value || []).indexOf(o) > -1;
          return html`<label key=${o} className=${'flex min-h-[48px] cursor-pointer items-center gap-3 border px-4 py-2 text-base transition-colors ' + (on ? 'border-ember bg-ember/10' : 'border-line hover:border-mute')}>
            <input type="checkbox" checked=${on} className="h-5 w-5 accent-[#FF6A00]" onChange=${() => onChange(f.k, on ? value.filter(x => x !== o) : [...(value || []), o])} />${o}</label>`;
        })}
      </div>
    </fieldset>`;
  } else control = html`<input id=${id} type=${f.type || 'text'} value=${value || ''} autoComplete=${f.auto} onChange=${e => onChange(f.k, e.target.value)} className=${common} placeholder=${f.ph || ''} ...${aria} />`;
  return html`<div className=${f.wide ? 'sm:col-span-2' : ''}>
    <label htmlFor=${id} className="mb-2 block text-sm font-medium">${f.label}${f.req ? html`<span className="text-ember"> *</span>` : html`<span className="text-mute"> (optional)</span>`}</label>
    ${control}
    ${error && html`<p id=${id + '-err'} className="mt-1 text-sm text-[#ff9a9a]">${error}</p>`}
  </div>`;
}

function InquiryForm({ id, title, subject, fields, cta, preset = {} }) {
  const init = {}; fields.forEach(f => { init[f.k] = f.type === 'checks' ? [] : (f.def || ''); });
  Object.assign(init, preset);
  const [vals, setVals] = useState(init);
  const [errs, setErrs] = useState({});
  const [done, setDone] = useState(null);
  const copyRef = useRef(null);
  const [copied, setCopied] = useState(false);
  const [sending, setSending] = useState(false);
  const onChange = (k, v) => setVals(p => ({ ...p, [k]: v }));

  const submit = () => {
    const e = {};
    fields.forEach(f => {
      const v = vals[f.k];
      if (f.req && (!v || (Array.isArray(v) && !v.length) || !String(v).trim())) e[f.k] = 'Enter ' + f.label.toLowerCase() + '.';
      else if (f.type === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) e[f.k] = 'Enter a valid email address, like name@example.com.';
    });
    setErrs(e);
    const first = fields.find(f => e[f.k]);
    if (first) { const el = document.getElementById('f-' + first.k); if (el) el.focus(); return; }
    const lines = fields.map(f => f.label + ': ' + (Array.isArray(vals[f.k]) ? (vals[f.k].join(', ') || '—') : (vals[f.k] || '—')));
    const body = lines.join('\n\n');
    const subj = subject + (vals.topic ? ' — ' + vals.topic : '');
    if (CONFIG.formsparkId) {
      setSending(true);
      const payload = { subject: subj };
      fields.forEach(f => { payload[f.label] = Array.isArray(vals[f.k]) ? vals[f.k].join(', ') : (vals[f.k] || ''); });
      fetch('https://submit-form.com/' + CONFIG.formsparkId, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) })
        .then(r => { if (!r.ok) throw new Error('bad status'); setDone({ mode: 'sent', body }); })
        .catch(() => setDone({ mode: 'fallback', body, subj }))
        .finally(() => setSending(false));
      return;
    }
    if (CONFIG.contactEmail) {
      window.location.href = 'mailto:' + CONFIG.contactEmail + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
      setDone({ mode: 'mail', body });
    } else setDone({ mode: 'none', body, subj });
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(done.body); setCopied(true); }
    catch (err) { if (copyRef.current) { copyRef.current.select(); try { document.execCommand('copy'); setCopied(true); } catch (e2) {} } }
  };
  const errCount = Object.keys(errs).length;

  if (done) {
    return html`<div id=${id} className="fadein border border-line bg-char p-6 sm:p-8" role="status">
      ${done.mode === 'sent'
        ? html`<h3 className="font-display text-3xl font-bold uppercase">Message sent</h3>
               <p className="mt-3 max-w-[60ch] text-mute">Thanks. Onyx Printing received your message and will follow up with you by email.</p>
               <div className="mt-5"><${Btn} variant="ghost" onClick=${() => { setDone(null); setCopied(false); }}>Send another message<//></div>`
        : done.mode === 'fallback'
        ? html`<h3 className="font-display text-3xl font-bold uppercase">Couldn’t send automatically</h3>
               <p className="mt-3 max-w-[60ch] text-mute">Your message has not been sent. Send it by email instead using the button below, or copy the text and email ${CONFIG.contactEmail}.</p>
               <div className="mt-5"><a href=${'mailto:' + CONFIG.contactEmail + '?subject=' + encodeURIComponent(done.subj) + '&body=' + encodeURIComponent(done.body)} className="inline-flex min-h-[52px] items-center justify-center rounded-[3px] bg-ember px-7 font-display text-[1.15rem] font-bold uppercase tracking-[.08em] text-ink hover:bg-[#ff8a33]">Open email draft</a></div>`
        : done.mode === 'mail'
        ? html`<h3 className="font-display text-3xl font-bold uppercase">Your email app should open</h3>
               <p className="mt-3 text-mute">We drafted your message. Send it from your email app to complete the request. If nothing opened, copy the text below and email it to ${CONFIG.contactEmail}.</p>`
        : html`<h3 className="font-display text-3xl font-bold uppercase">This form is not connected yet</h3>
               <p className="mt-3 max-w-[60ch] text-mute">Nothing was sent. This preview has no inbox or form service attached, so your message has not reached Onyx Printing. Copy your message below and email it to Onyx directly.</p>`}
      ${done.mode !== 'sent' && html`<label htmlFor=${id + '-copy'} className="sr-only">Your message</label>
      <textarea id=${id + '-copy'} ref=${copyRef} readOnly rows="8" value=${done.body} className="mt-5 w-full border border-line bg-ink p-4 text-sm text-bone"></textarea>
      <div className="mt-4 flex flex-wrap gap-3">
        <${Btn} onClick=${copy}>${copied ? 'Copied' : 'Copy message'}<//>
        <${Btn} variant="ghost" onClick=${() => { setDone(null); setCopied(false); }}>Edit message<//>
      </div>`}
    </div>`;
  }
  return html`<div id=${id} role="group" aria-label=${title} className="border border-line bg-char p-6 sm:p-8">
    <h3 className="font-display text-3xl font-bold uppercase">${title}</h3>
    ${errCount > 0 && html`<p role="alert" className="mt-3 border-l-4 border-[#ff7a7a] bg-ink px-4 py-3 text-sm">Fix ${errCount} ${errCount === 1 ? 'field' : 'fields'} below, then send again.</p>`}
    <div className="mt-6 grid gap-5 sm:grid-cols-2">
      ${fields.map(f => html`<${Field} key=${f.k} f=${f} value=${vals[f.k]} error=${errs[f.k]} onChange=${onChange} />`)}
    </div>
    <div className="mt-7"><${Btn} onClick=${submit} disabled=${sending}>${sending ? 'Sending…' : cta}<//></div>
  </div>`;
}

/* ============================================================
   App + hash router
   ============================================================ */
const TITLES = { '/': 'Built without compromise.', '/products': 'Products', '/ra-1': 'RA-1 Naloxone Holster', '/agencies': 'For agencies', '/about': 'About', '/contact': 'Contact' };

function useRoute() {
  const get = () => (window.location.hash.replace(/^#/, '') || '/');
  const [r, setR] = useState(get());
  useEffect(() => { const h = () => setR(get()); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  return r;
}

function App() {
  const route = useRoute();
  const [path, query] = route.split('?');
  useEffect(() => {
    document.title = 'Onyx Printing — ' + (TITLES[path] || TITLES['/']);
    if (query === 'form') {
      setTimeout(() => { const el = document.getElementById('agency-form'); if (el) el.scrollIntoView({ block: 'start' }); }, 60);
    } else {
      window.scrollTo(0, 0);
      const m = document.getElementById('main'); if (m) m.focus({ preventScroll: true });
    }
  }, [route]);
  const Page = { '/products': Products, '/ra-1': RA1, '/agencies': Agencies, '/about': About, '/contact': Contact }[path] || Home;
  return html`
    <button type="button" className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:bg-ember focus:px-5 focus:py-3 focus:font-bold focus:text-ink"
      onClick=${() => { const m = document.getElementById('main'); if (m) { m.focus(); m.scrollIntoView(); } }}>Skip to content</button>
    <${Header} path=${path} />
    <main id="main" tabIndex=${-1}><${Page} key=${route} query=${query} /></main>
    <${Footer} />`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${MediaProvider}><${App} /><//>`);
